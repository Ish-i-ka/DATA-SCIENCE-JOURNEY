<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Form</title>
</head>
<body>
    <form action="/getresults" method="post">
        <label for="science">Science Marks:</label><br>
        <input type="text" id="science" name="science" value="0"><br>

        <label for="maths">Maths Marks:</label><br>
        <input type="text" id="maths" name="maths" value="0"><br><br>

        <label for="c">C Marks:</label><br>
        <input type="text" id="c" name="c" value="0"><br><br>

        <label for="datascience">Data Science Marks:</label><br>
        <input type="text" id="datascience" name="datascience" value="0"><br><br>

        <input type="submit" value="Submit">
    </form>
    <p>If you click Submit button, the form data will be sent to a page called "/submit"</p>
</body>
</html>
